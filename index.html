<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NULL BYTE MULTI GAMES BUNDLE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <!-- LEFT : game wall -->
    <section class="gamewall">
      <div class="gamewall-fade top"></div>

      <div class="gamewall-grid">
        <div class="col col--a"></div>
        <div class="col col--b"></div>
        <div class="col col--c"></div>
      </div>

      <div class="gamewall-fade bottom"></div>

      <div class="tagline">
        <span class="tagline-eyebrow">// NULL_BYTE</span>
        <h2>FIND EXPERIENCES<br>THAT MATTER</h2>
      </div>
    </section>

    <!-- RIGHT : brand + auth -->
    <section class="authpane">
      <div class="authpane-glow"></div>

      <div class="brand">
        <img src="https://i.postimg.cc/6QfVdbNv/Whats-App-Image-2026-06-26-at-12-01-53-PM-2-removebg-preview.png" alt="Null Byte" class="brand-logo">
        <div class="brand-name">
          <span class="brand-name-line">NULL BYTE</span>
          <span class="brand-name-line brand-name-sub">MULTI GAMES BUNDLE</span>
        </div>
      </div>

      <div class="auth-card">
        <p class="auth-eyebrow">ORDER AUTHENTICATION</p>
        <h1>UNLOCK YOUR<br>BUNDLE</h1>
        <p class="auth-desc">Enter the Order ID you received at checkout to access your library.</p>

        <label class="field-label" for="orderId">ORDER ID</label>
        <div class="field-wrap">
          <input type="text" id="orderId" class="field-input" placeholder="ENTER ORDER ID" autocomplete="off" spellcheck="false">
        </div>

        <button id="loginBtn" class="login-btn">
          <span>LOGIN</span>
        </button>

        <p id="authMsg" class="auth-msg"></p>
      </div>

      <p class="footnote">NULL BYTE © 2026 — ALL BUNDLES FINAL SALE</p>
    </section>

  </div>

<script src="home.js"></script>
</body>
</html>
